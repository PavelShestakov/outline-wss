name: outline-wss
services:
  node:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./config/node.env
    volumes:
      - ./data:/data
    expose:
      - "18081"
      - "18443"
    networks:
      - internal
    healthcheck:
      test: ["CMD", "python", "-c", "import os,urllib.request; urllib.request.urlopen('http://127.0.0.1:18443/m/'+os.environ['OUTLINE_ADMIN_TOKEN']+'/health', timeout=5)"]
      interval: 20s
      timeout: 8s
      retries: 4
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  api-tls:
    image: nginx:stable-alpine
    restart: unless-stopped
    depends_on:
      - node
    ports:
      - "${API_PORT}:443/tcp"
    volumes:
      - ./config/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./config/tls:/etc/nginx/tls:ro
    networks:
      - internal
    security_opt:
      - no-new-privileges:true

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - internal
    depends_on:
      - node
    security_opt:
      - no-new-privileges:true

networks:
  internal:
    driver: bridge
